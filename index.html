        </div>
        <div class="field wide">
         <label for="payment-note">内容（任意）</label><input id="payment-note" class="input canva-input" maxlength="80" placeholder="例：食事代">
        </div>
        <div class="wide">
         <button id="payment-submit" type="submit" class="btn lime canva-button"><i data-lucide="plus"></i> 支払いを追加</button><button id="payment-cancel" type="button" class="btn canva-button" hidden>キャンセル</button>
        </div>
       </form>
       <div id="payment-error" class="error" role="alert"></div>
       <div id="payments-list" class="canva-list"></div>
      </section>
     </div>
     <div class="column">
      <section class="card summary canva-card" aria-labelledby="summary-heading">
       <div id="summary-heading" class="label">現在までの合計支払額</div>
       <div id="total-amount" class="total">¥0</div>
       <div class="summary-bottom">
        <span class="label">1人あたりの負担額</span><strong id="per-person">¥0</strong>
       </div>
      </section>
      <section class="card canva-card" aria-labelledby="balances-heading">
       <div class="section-head">
        <h2 id="balances-heading">メンバー別の精算</h2>
       </div>
       <div id="balances-list" class="canva-list"></div>
       <p class="hint">端数が出る場合は、メンバーの並び順に1円ずつ割り当てます。</p>
      </section>
      <section class="card canva-card" aria-labelledby="transfers-heading">
       <div class="section-head">
        <h2 id="transfers-heading">誰が誰に支払う？</h2>
        <span id="transfer-count" class="count canva-tag">0件</span>
       </div>
       <div id="transfers-list" class="canva-list"></div>
      </section>
     </div>
    </div>
    <footer class="footer canva-footer">GOOD TIMES, FAIR SHARES.</footer>
   </main>
  </div>
  <script>
(() => {
  const $ = id => document.getElementById(id);
  const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
  const today = () => new Date().toLocaleDateString('sv-SE');
  const blank = () => ({fileName:'新しい割り勘', title:'', date:today(), members:[], payments:[]});
  let files=[], activeId=null, draft=blank(), dirty=false, editingPayment=null, busy=false, confirmAction=null, initialized=false;
  const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function message(text){$('notice').textContent=text; if(text) setTimeout(()=>{if($('notice').textContent===text)$('notice').textContent=''},5500)}
  function setDirty(){dirty=true;$('save-status').textContent='未保存の変更があります';renderFiles()}
  function payload(){return {file_name:draft.fileName,title:draft.title,event_date:draft.date,content_json:JSON.stringify({members:draft.members,payments:draft.payments}),updated_at:new Date().toISOString()}}
  function hydrate(row){let content={};try{content=JSON.parse(row.content_json||'{}')}catch(e){} return {fileName:row.file_name||'無題のファイル',title:row.title||'',date:row.event_date||'',members:Array.isArray(content.members)?content.members:[],payments:Array.isArray(content.payments)?content.payments:[]}}
  function icon(){if(window.lucide)lucide.createIcons()}
  function renderFiles(){
    const list=$('file-list');list.innerHTML=files.length?files.slice().sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at))).map(f=>`<button type="button" class="file-btn canva-button ${f.__backendId===activeId?'active':''}" data-file="${escapeHTML(f.__backendId)}"><span class="file-title">${escapeHTML(f.file_name||'無題のファイル')}</span><span class="file-date">${escapeHTML(f.event_date||'日付未設定')}${f.__backendId===activeId&&dirty?' · 編集中':''}</span></button>`).join(''):'<div class="side-empty">まだファイルがありません。<br>新しい割り勘を作成しましょう。</div>';
  }
  function render(){
    $('event-title').value=draft.title;$('event-date').value=draft.date;$('page-heading').textContent=draft.title||'割り勘を、すっきり。';
    $('member-count').textContent=draft.members.length+'人';$('payment-count').textContent=draft.payments.length+'件';
    $('members-list').innerHTML=draft.members.length?draft.members.map((m,i)=>`<div class="member-row"><span class="avatar">${escapeHTML(m.name.trim().charAt(0)||'?')}</span><span class="member-name">${escapeHTML(m.name)}</span><button type="button" class="icon-btn danger canva-button" data-remove-member="${escapeHTML(m.id)}" aria-label="${escapeHTML(m.name)}を削除"><i data-lucide="trash-2"></i></button></div>`).join(''):'<div class="empty">メンバーを追加すると、割り勘を始められます。</div>';
    const select=$('payment-member'), selected=select.value;
    select.innerHTML='<option value="">選択してください</option>'+draft.members.map(m=>`<option value="${escapeHTML(m.id)}">${escapeHTML(m.name)}</option>`).join('');
    if(draft.members.some(m=>m.id===selected))select.value=selected;
    $('payments-list').innerHTML=draft.payments.length?draft.payments.map(p=>{const m=draft.members.find(m=>m.id===p.memberId);return `<div class="payment-row"><span class="avatar"><i data-lucide="receipt"></i></span><div class="payment-info"><div class="payment-title">${escapeHTML(p.note||'支払い')}</div><div class="payment-sub">${escapeHTML(m?.name||'削除済みメンバー')}が支払い</div></div><span class="amount">${yen(p.amount)}</span><button type="button" class="icon-btn canva-button" data-edit-payment="${escapeHTML(p.id)}" aria-label="支払いを編集"><i data-lucide="pencil"></i></button><button type="button" class="icon-btn danger canva-button" data-remove-payment="${escapeHTML(p.id)}" aria-label="支払いを削除"><i data-lucide="trash-2"></i></button></div>`}).join(''):'<div class="empty">支払いはまだありません。<br>立て替えた金額を追加してください。</div>';
    const total=draft.payments.reduce((s,p)=>s+Number(p.amount||0),0), count=draft.members.length, base=count?Math.floor(total/count):0, extra=count?total%count:0;
    $('total-amount').textContent=yen(total);$('per-person').textContent=count?(extra?`${yen(base)}〜${yen(base+1)}`:yen(base)):'¥0';
    const balances=draft.members.map((m,i)=>({id:m.id,name:m.name,paid:draft.payments.filter(p=>p.memberId===m.id).reduce((s,p)=>s+Number(p.amount||0),0),due:base+(i<extra?1:0)})).map(x=>({...x,diff:x.paid-x.due}));
    $('balances-list').innerHTML=balances.length?balances.map(b=>`<div class="balance-row"><span class="avatar">${escapeHTML(b.name.trim().charAt(0)||'?')}</span><div class="balance-info"><strong>${escapeHTML(b.name)}</strong><small>支払済み ${yen(b.paid)} · 負担 ${yen(b.due)}</small></div><div class="balance-value ${b.diff>0?'positive':b.diff<0?'negative':'neutral'}">${b.diff>0?'+':''}${yen(b.diff)}<div class="member-sub">${b.diff>0?'受け取り':b.diff<0?'支払い':'精算なし'}</div></div></div>`).join(''):'<div class="empty">メンバーを追加すると内訳が表示されます。</div>';
    const transfers=settle(balances);$('transfer-count').textContent=transfers.length+'件';
    $('transfers-list').innerHTML=transfers.length?transfers.map(t=>`<div class="transfer"><div class="route"><small>FROM → TO</small>${escapeHTML(t.from)} <i data-lucide="arrow-right"></i> ${escapeHTML(t.to)}</div><strong>${yen(t.amount)}</strong></div>`).join(''):`<div class="empty">${count<2?'2人以上のメンバーを追加すると、精算方法を表示します。':total===0?'支払いを追加すると、精算方法を表示します。':'送金は不要です。すべて精算済みです。'}</div>`;
    $('save-status').textContent=dirty?'未保存の変更があります':activeId?'保存済み':'新しいファイル';
    $('rename-file').disabled=!activeId;$('delete-file').disabled=!activeId;renderFiles();icon();
  }
  function settle(balances){
    const debt=balances.filter(x=>x.diff<0).map(x=>({name:x.name,n:-x.diff})), credit=balances.filter(x=>x.diff>0).map(x=>({name:x.name,n:x.diff}));
    if(!debt.length||!credit.length)return [];
    let best=null;
    if(debt.length+credit.length<=10){
      const remainingD=debt.map(x=>x.n),remainingC=credit.map(x=>x.n),path=[];
      function search(){
        if(best&&path.length>=best.length)return;
        let di=remainingD.findIndex(n=>n>0);if(di<0){best=path.slice();return}
        const seen=new Set();
        for(let j=0;j<credit.length;j++){const available=remainingC[j];if(!available||seen.has(available))continue;seen.add(available);const v=Math.min(remainingD[di],available);remainingD[di]-=v;remainingC[j]-=v;path.push({from:debt[di].name,to:credit[j].name,amount:v});search();path.pop();remainingD[di]+=v;remainingC[j]+=v;if(available>=remainingD[di])break}
      }
      search();if(best)return best;
    }
    let i=0,j=0,result=[];while(i<debt.length&&j<credit.length){let amount=Math.min(debt[i].n,credit[j].n);result.push({from:debt[i].name,to:credit[j].name,amount});debt[i].n-=amount;credit[j].n-=amount;if(!debt[i].n)i++;if(!credit[j].n)j++}return result;
  }
  function showConfirm(target,text,onYes){$(target).innerHTML=`<div class="confirm canva-panel"><p>${escapeHTML(text)}</p><div class="confirm-actions"><button type="button" class="btn danger canva-button" data-confirm-yes>削除・続行</button><button type="button" class="btn canva-button" data-confirm-no>キャンセル</button></div></div>`;confirmAction={target,onYes};$(target).querySelector('[data-confirm-yes]').onclick=()=>{const action=confirmAction;$(target).innerHTML='';confirmAction=null;action?.onYes()};$(target).querySelector('[data-confirm-no]').onclick=()=>{$(target).innerHTML='';confirmAction=null}}
  function guard(action){if(dirty)showConfirm('global-confirm','未保存の変更があります。保存せずに移動しますか？',action);else action()}
  function openFile(id){const row=files.find(f=>f.__backendId===id);if(!row)return;activeId=id;draft=hydrate(row);dirty=false;editingPayment=null;resetPayment();render()}
  function resetPayment(){$('payment-form').reset();$('payment-submit').innerHTML='<i data-lucide="plus"></i> 支払いを追加';$('payment-cancel').hidden=true;$('payment-error').textContent='';editingPayment=null;icon()}
  async function mutate(button,work){if(busy)return;busy=true;button.disabled=true;const old=button.innerHTML;button.textContent='処理中…';try{const result=await work();if(!result.isOk)message('保存できませんでした。少し待ってから再度お試しください。');return result.isOk}catch(e){message('通信に失敗しました。接続を確認して再度お試しください。');return false}finally{busy=false;button.disabled=false;button.innerHTML=old;icon()}}
  $('event-title').addEventListener('input',e=>{draft.title=e.target.value;$('page-heading').textContent=draft.title||'割り勘を、すっきり。';setDirty()});
  $('event-date').addEventListener('input',e=>{draft.date=e.target.value;setDirty()});
  $('member-form').addEventListener('submit',e=>{e.preventDefault();const name=$('member-name').value.trim();$('member-error').textContent='';if(!name){$('member-error').textContent='名前を入力してください。';return}if(draft.members.some(m=>m.name===name)){$('member-error').textContent='同じ名前のメンバーがいます。';return}draft.members.push({id:uid(),name});$('member-name').value='';setDirty();render()});
  $('members-list').addEventListener('click',e=>{const b=e.target.closest('[data-remove-member]');if(!b)return;const m=draft.members.find(x=>x.id===b.dataset.removeMember);if(!m)return;const n=draft.payments.filter(p=>p.memberId===m.id).length;showConfirm('member-confirm',`${m.name}さんを削除しますか？${n?'この人の支払い '+n+'件も削除されます。':''}`,()=>{draft.members=draft.members.filter(x=>x.id!==m.id);draft.payments=draft.payments.filter(p=>p.memberId!==m.id);if(editingPayment&&!draft.payments.some(p=>p.id===editingPayment))resetPayment();setDirty();render()})});
  $('payment-form').addEventListener('submit',e=>{e.preventDefault();const memberId=$('payment-member').value,raw=$('payment-amount').value.trim(),amount=Number(raw),note=$('payment-note').value.trim();$('payment-error').textContent='';if(!draft.members.some(m=>m.id===memberId)){$('payment-error').textContent='支払った人を選択してください。';return}if(raw===''||!Number.isSafeInteger(amount)||amount<0||amount>999999999999){$('payment-error').textContent='金額は0円以上の整数で入力してください。';return}if(editingPayment){const p=draft.payments.find(x=>x.id===editingPayment);if(p)Object.assign(p,{memberId,amount,note})}else draft.payments.push({id:uid(),memberId,amount,note});resetPayment();setDirty();render()});
  $('payment-cancel').onclick=resetPayment;
  $('payments-list').addEventListener('click',e=>{const edit=e.target.closest('[data-edit-payment]'),remove=e.target.closest('[data-remove-payment]');if(edit){const p=draft.payments.find(x=>x.id===edit.dataset.editPayment);if(!p)return;editingPayment=p.id;$('payment-member').value=p.memberId;$('payment-amount').value=p.amount;$('payment-note').value=p.note;$('payment-submit').innerHTML='<i data-lucide="check"></i> 変更を反映';$('payment-cancel').hidden=false;$('payment-amount').focus();icon()}if(remove){draft.payments=draft.payments.filter(p=>p.id!==remove.dataset.removePayment);if(editingPayment===remove.dataset.removePayment)resetPayment();setDirty();render()}});
  $('new-file').onclick=()=>guard(()=>{activeId=null;draft=blank();dirty=false;resetPayment();render();$('event-title').focus()});
  $('file-list').addEventListener('click',e=>{const b=e.target.closest('[data-file]');if(b&&b.dataset.file!==activeId)guard(()=>openFile(b.dataset.file))});
  $('save-file').onclick=async e=>{if(!initialized){message('保存機能を読み込めませんでした。ページを再読み込みしてください。');return}if(!draft.fileName.trim()){message('ファイル名を入力してください。');return}if(!activeId&&files.length>=999){message('ファイルは最大999件です。不要なファイルを削除してください。');return}const data=payload(),id=activeId;const ok=await mutate(e.currentTarget,()=>id?window.dataSdk.update({...files.find(f=>f.__backendId===id),...data}):window.dataSdk.create(data));if(ok){dirty=false;message('ファイルを保存しました。');$('save-status').textContent='保存済み';if(!id){const matches=files.filter(f=>f.file_name===data.file_name&&f.updated_at===data.updated_at);if(matches.length)activeId=matches[0].__backendId}renderFiles()}};
  $('rename-file').onclick=()=>{if(!activeId)return;const previous=$('global-confirm').innerHTML;$('global-confirm').innerHTML=`<form id="rename-form" class="confirm canva-panel"><label for="rename-input">ファイル名を変更</label><div class="inline-form"><input id="rename-input" class="input canva-input" maxlength="80" required><button type="submit" class="btn primary canva-button">変更</button><button type="button" id="rename-cancel" class="btn canva-button">キャンセル</button></div></form>`;$('rename-input').value=draft.fileName;$('rename-input').focus();$('rename-cancel').onclick=()=>{$('global-confirm').innerHTML=previous};$('rename-form').onsubmit=e=>{e.preventDefault();const name=$('rename-input').value.trim();if(!name)return;draft.fileName=name;$('global-confirm').innerHTML='';setDirty();render();message('新しい名前を保存するには「保存する」を押してください。')}};
  $('delete-file').onclick=()=>{if(!activeId)return;const id=activeId;showConfirm('global-confirm',`「${draft.fileName}」を完全に削除しますか？`,async()=>{const row=files.find(f=>f.__backendId===id);if(!row)return;const button=$('delete-file');const ok=await mutate(button,()=>window.dataSdk.delete(row));if(ok){activeId=null;draft=blank();dirty=false;resetPayment();render();message('ファイルを削除しました。')}})};
  const handler={onDataChanged(data){files=data;if(activeId&&!files.some(f=>f.__backendId===activeId)){activeId=null;draft=blank();dirty=false;render()}else if(activeId&&!dirty){const row=files.find(f=>f.__backendId===activeId);if(row){draft=hydrate(row);render()}}else if(!activeId&&!dirty&&files.length&&initialized){/* 新規作成中の空欄は維持 */}renderFiles()}};
  (async()=>{try{const result=await window.dataSdk.init(handler);initialized=result.isOk;if(!result.isOk)message('保存機能を読み込めませんでした。ページを再読み込みしてください。')}catch(e){message('保存機能を読み込めませんでした。ページを再読み込みしてください。')}render()})();
})();
</script>
 </body>
